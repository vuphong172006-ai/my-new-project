<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form thông tin cá nhân - Phần 1</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"] {
            background-color: #28a745;
            color: white;
        }
        button[type="reset"] {
            background-color: #dc3545;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>SỞ THÍCH CỦA BẠN</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname" required placeholder="Nhập họ và tên...">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Nhập địa chỉ email...">
        </div>

        <div class="form-group checkbox-group">
            <label>Sở thích:</label><br>
            <label><input type="checkbox" name="hobby" value="Thể thao"> Thể thao</label>
            <label><input type="checkbox" name="hobby" value="Âm nhạc"> Âm nhạc</label>
            <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label><br>
            <label><input type="checkbox" name="hobby" value="Lướt web"> Lướt web</label>
            <label><input type="checkbox" name="hobby" value="Chơi game"> Chơi game</label>
            <label><input type="checkbox" name="hobby" value="Du lịch"> Du lịch</label>
        </div>

        <div class="button-group">
            <button type="submit">Gửi thông tin</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>
</div>

</body>
</html>
